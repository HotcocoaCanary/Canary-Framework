name: CI

on:
  push:
    branches: [main, "[0-9]+.x"]
  pull_request:
    branches: [main, "[0-9]+.x"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy strict)
        run: uv run mypy src/ tests/

      - name: Test & coverage
        run: uv run pytest --cov=src/canary_framework --cov-report=term --cov-report=xml --cov-fail-under=95

      - name: Check version consistency
        run: |
          uv run python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              p = tomllib.load(f)
          ver = p['project']['version']
          from canary_framework import __version__
          assert __version__ == ver, f'{__version__} != {ver}'
          print(f'Version {ver} OK')
          "

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra docs

      - name: Build docs (strict)
        run: uv run mkdocs build --strict
