name: 🐛 Bug 报告 / Bug Report
description: 报告框架的 bug 或异常行为 / Report a bug or unexpected behavior
labels: [bug]
body:
  - type: textarea
    attributes:
      label: 描述问题 / Describe the bug
      description: 请清晰描述你遇到的问题 / A clear description of the problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 提供最小复现代码 / Provide a minimal reproduction
      render: python
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望行为 / Expected behavior
      description: 你期望发生什么？/ What did you expect to happen?
    validations:
      required: true
  - type: input
    attributes:
      label: CF 版本 / Version
      placeholder: "例如 0.9.0"
    validations:
      required: true
  - type: input
    attributes:
      label: Python 版本 / Python version
      placeholder: "3.12"
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统 / OS
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
  - type: textarea
    attributes:
      label: 其他上下文 / Additional context
      description: 日志输出、截图等 / Logs, screenshots, etc.
