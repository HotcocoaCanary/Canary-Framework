[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "canary-framework"
version = "1.2.0"
description = "Canary — dependency injection and lifecycle for plain Python classes, with zero dependencies"
requires-python = ">=3.12"
dependencies = []
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "framework",
    "dependency-injection",
    "lifecycle",
    "decorator",
    "canary",
    "di",
    "container",
    "ioc",
    "asgi",
    "settings",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[[project.authors]]
name = "张文博 (Canary)"
email = "Cacao.Canary@outlook.com"

[project.urls]
Repository = "https://github.com/HotcocoaCanary/Canary-Framework"
Documentation = "https://hotcocoacanary.github.io/Canary-Framework/"
Issues = "https://github.com/HotcocoaCanary/Canary-Framework/issues"
Changelog = "https://github.com/HotcocoaCanary/Canary-Framework/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# 扩展包的第三方依赖。核心（canary_framework.core）与 canary_framework.test 不需要任何一项。
config = ["pydantic-settings>=2.15"]
# web.asgi.app 与 web.asgi.server 各站协议的一侧，互不依赖；web 是两者一起。
app = ["pydantic>=2.7"]
server = ["uvicorn>=0.52"]
web = ["canary-framework[app,server]"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocs-static-i18n>=1.3"]
# 只够跑核心测试：CI 用它证明核心在没有任何扩展依赖的环境里成立。
test = [
    "pytest>=8.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]
dev = [
    "canary-framework[config,web,test]",
    "httpx>=0.28",
    # 只用来测"服务器单元能服务别的框架的应用"
    "fastapi>=0.121",
    "ruff>=0.15.15",
    "mypy>=1.11",
    "pre-commit>=4.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests — isolated, no framework engine needed.",
    "integration: Integration tests — multiple components working together.",
    "functional: Functional tests — end-to-end user scenarios.",
    "slow: Slow tests — performance or large-scale tests.",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unused_configs = true
warn_unused_ignores = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true


[tool.hatch.build.targets.wheel]
packages = ["src/canary_framework"]

[tool.hatch.build.targets.sdist]
# 显式列出：examples/ 是子模块（示例仓库），不属于框架的源码包
only-include = ["src", "tests", "README.md", "README_ZH.md", "CHANGELOG.md", "LICENSE"]
