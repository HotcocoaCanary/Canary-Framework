site_name: Canary Framework
site_description: A minimal, decorator-driven dependency-injection, lifecycle and ASGI web framework
site_author: 张文博 (Canary)
copyright: Copyright &copy; 2026 张文博 (Canary)

repo_url: https://github.com/HotcocoaCanary/Canary-Framework
repo_name: HotcocoaCanary/Canary-Framework
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    logo: material/bird

# 内部设计文档（docs/superpowers/**）不纳入站点构建。
# Internal design docs under docs/superpowers/** are excluded from the built site.
exclude_docs: |
  superpowers/

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 中文
          build: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - What's New: whats-new.md
  - Quick Start: quickstart.md
  - Core:
      - Cocoa Units: cocoa.md
      - Runtime (Canary): canary.md
      - Lifecycle: lifecycle.md
      - Dependency Injection: dependency-injection.md
  - Web:
      - Web Apps: web.md
  - Architecture: architecture.md
  - API Reference: api-reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HotcocoaCanary/Canary-Framework
