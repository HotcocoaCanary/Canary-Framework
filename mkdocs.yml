site_name: Canary Framework
site_description: Dependency injection and lifecycle for plain Python classes, with zero dependencies
site_author: 张文博 (Canary)
copyright: Copyright &copy; 2026 张文博 (Canary)

repo_url: https://github.com/HotcocoaCanary/Canary-Framework
repo_name: HotcocoaCanary/Canary-Framework
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
    logo: material/bird

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: zh
          name: 中文
          build: true
          site_description: 面向普通 Python 类的依赖注入与生命周期框架，零依赖
          nav_translations:
            Home: 首页
            Why Canary: 为什么选 Canary
            What's New in 1.1: 1.1 新特性
            What's New in 1.0: 1.0 新特性
            Quick Start: 快速开始
            Guide: 指南
            Units: 单元
            Dependencies: 依赖
            Lifecycle: 生命周期
            Patterns: 常见用法
            Reference: 参考
            API Reference: API 参考
            Architecture: 架构
            Versioning & Compatibility: 版本与兼容性
            Upgrading from 0.9.x: 从 0.9.x 升级
            Project: 项目
            Contributing: 贡献指南
            Governance: 项目治理
            Changelog: 变更日志

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why Canary: why-canary.md
  - What's New in 1.1: whats-new.md
  - Quick Start: quickstart.md
  - Guide:
      - Units: canary.md
      - Dependencies: dependency-injection.md
      - Lifecycle: lifecycle.md
      - Patterns: patterns.md
  - Reference:
      - API Reference: api-reference.md
      - Architecture: architecture.md
      - Versioning & Compatibility: versioning.md
      - What's New in 1.0: whats-new-1.0.md
      - Upgrading from 0.9.x: upgrading-from-0.9.md
  - Project:
      - Contributing: contributing.md
      - Governance: governance.md
      - Changelog: https://github.com/HotcocoaCanary/Canary-Framework/blob/main/CHANGELOG.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HotcocoaCanary/Canary-Framework
